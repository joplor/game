<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ FRIEND CHAOS BATTLE SIMULATOR ⚡</title>
<style>
:root { --c0:#00ffff; --c1:#ff00ff; --c2:#ffff00; --dark:#05050f; }
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--dark);color:#fff;font-family:'Courier New',monospace;min-height:100vh;overflow-x:hidden}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,255,255,.02) 3px,rgba(0,255,255,.02) 4px);pointer-events:none;z-index:9999}

/* HEADER */
.hdr{text-align:center;padding:18px 20px 12px;border-bottom:1px solid rgba(0,255,255,.2);background:linear-gradient(180deg,rgba(0,255,255,.08),transparent)}
.title{font-size:clamp(1.4rem,4vw,2.6rem);font-weight:900;text-transform:uppercase;letter-spacing:4px;background:linear-gradient(90deg,#00ffff,#ff00ff,#ffff00,#00ffff);background-size:300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 3s linear infinite}
@keyframes shimmer{to{background-position:300% center}}
.sub{font-size:.7rem;opacity:.4;letter-spacing:3px;margin-top:4px}
.global-bar{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.gbar-wrap{width:260px;height:16px;background:rgba(255,255,255,.08);border:1px solid #ff00ff;border-radius:8px;overflow:hidden}
.gbar-fill{height:100%;background:linear-gradient(90deg,#ff00ff,#ffff00,#ff0000);border-radius:8px;transition:width .5s ease;width:0%}
.glabel{font-size:.75rem;opacity:.6}

/* ARENA */
.arena{display:flex;justify-content:center;align-items:flex-start;gap:16px;padding:24px 16px;flex-wrap:wrap}

/* CARD */
.card{position:relative;width:260px;background:rgba(0,15,35,.85);border-radius:14px;padding:18px;cursor:pointer;transition:transform .25s,box-shadow .25s;user-select:none}
.card[data-i="0"]{border:2px solid var(--c0);box-shadow:0 0 18px rgba(0,255,255,.25)}
.card[data-i="1"]{border:2px solid var(--c1);box-shadow:0 0 18px rgba(255,0,255,.25)}
.card[data-i="2"]{border:2px solid var(--c2);box-shadow:0 0 18px rgba(255,255,0,.25)}
.card:hover{transform:translateY(-6px) scale(1.03)}
.card[data-i="0"]:hover{box-shadow:0 0 40px rgba(0,255,255,.6)}
.card[data-i="1"]:hover{box-shadow:0 0 40px rgba(255,0,255,.6)}
.card[data-i="2"]:hover{box-shadow:0 0 40px rgba(255,255,0,.6)}

/* AVATAR */
.av-wrap{position:relative;width:150px;height:150px;margin:0 auto 14px}
.av-ring{position:absolute;inset:-6px;border-radius:50%;animation:spin 3.5s linear infinite}
.card[data-i="0"] .av-ring{background:conic-gradient(transparent 60%,var(--c0),transparent)}
.card[data-i="1"] .av-ring{background:conic-gradient(transparent 60%,var(--c1),transparent)}
.card[data-i="2"] .av-ring{background:conic-gradient(transparent 60%,var(--c2),transparent)}
@keyframes spin{to{transform:rotate(360deg)}}
.av-img{width:150px;height:150px;border-radius:50%;object-fit:cover;object-position:center 10%;position:relative;z-index:1;border:3px solid rgba(255,255,255,.15)}
.card[data-i="0"] .av-wrap{animation:bob0 2s ease-in-out infinite}
.card[data-i="1"] .av-wrap{animation:bob1 2.4s ease-in-out infinite}
.card[data-i="2"] .av-wrap{animation:bob2 1.9s ease-in-out infinite}
@keyframes bob0{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bob1{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.cname{text-align:center;font-size:1.1rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.ctitle{text-align:center;font-size:.65rem;letter-spacing:1px;opacity:.6;margin-bottom:14px;text-transform:uppercase}

/* STATS */
.stats{display:flex;flex-direction:column;gap:7px}
.srow{display:flex;align-items:center;gap:7px;font-size:.72rem}
.slabel{width:48px;text-align:right;opacity:.7}
.sbar{flex:1;height:9px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden}
.sfill{height:100%;border-radius:5px;transition:width .5s ease}
.sfill.hp{background:linear-gradient(90deg,#00ff88,#00ffcc)}
.sfill.ego{background:linear-gradient(90deg,#ff8800,#ffdd00)}
.sfill.chaos{background:linear-gradient(90deg,#ff0055,#ff00ff)}
.sval{width:28px;font-size:.68rem;opacity:.7}

.cstatus{text-align:center;font-size:.78rem;min-height:28px;margin-top:8px;opacity:.75;font-style:italic;transition:all .3s}
.wbadge{position:absolute;top:-8px;right:-8px;background:#ffff00;color:#000;font-size:.65rem;font-weight:900;padding:2px 7px;border-radius:8px;display:none}

/* SHAKE / VICTORY / HURT */
@keyframes shake{0%,100%{transform:translateX(0)}10%{transform:translateX(-6px) rotate(-2deg)}20%{transform:translateX(6px) rotate(2deg)}30%{transform:translateX(-6px)}40%{transform:translateX(6px)}50%{transform:translateX(-4px)}70%{transform:translateX(3px)}90%{transform:translateX(-1px)}}
@keyframes victory{0%,100%{transform:scale(1)}25%{transform:scale(1.1) rotate(-3deg)}50%{transform:scale(1.15) rotate(3deg)}75%{transform:scale(1.1) rotate(-2deg)}}
@keyframes hurt{0%,100%{filter:brightness(1)}25%{filter:brightness(4) hue-rotate(90deg)}75%{filter:brightness(.4) saturate(0)}}
.do-shake{animation:shake .6s ease!important}
.do-victory{animation:victory .5s ease 3!important}
.do-hurt{animation:hurt .5s ease!important}

/* CONTROLS */
.ctrl{padding:16px 20px;text-align:center}
.ctrl-label{font-size:.7rem;opacity:.4;letter-spacing:3px;margin-bottom:14px;text-transform:uppercase}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:16px}
.btn{padding:11px 22px;border:none;border-radius:8px;font-family:'Courier New',monospace;font-size:.82rem;font-weight:700;letter-spacing:1px;cursor:pointer;text-transform:uppercase;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.15);opacity:0;transition:opacity .15s}
.btn:active::after{opacity:1}
.b-ego{background:linear-gradient(135deg,#ff8800,#ffdd00);color:#000}
.b-arg{background:linear-gradient(135deg,#8800ff,#ff00ff);color:#fff}
.b-chaos{background:linear-gradient(135deg,#ff0055,#ff6600);color:#fff}
.b-comp{background:linear-gradient(135deg,#00ff88,#00ffcc);color:#000}
.b-roast{background:linear-gradient(135deg,#ff00ff,#ff0055);color:#fff}
.b-power{background:linear-gradient(135deg,#ffff00,#ff8800);color:#000}
.b-duel{background:linear-gradient(135deg,#0088ff,#00ffff);color:#000;font-size:.95rem;padding:14px 38px;box-shadow:0 0 20px rgba(0,255,255,.4)}
.b-duel:hover{box-shadow:0 0 40px rgba(0,255,255,.7)}
.b-reset{background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.2)}

/* LOG */
.log-wrap{max-width:680px;margin:0 auto 20px;padding:0 16px}
.log-box{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:12px 14px;max-height:130px;overflow-y:auto}
.log-title{font-size:.65rem;opacity:.35;margin-bottom:6px;letter-spacing:2px}
.log-entry{font-size:.76rem;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04);opacity:0;animation:fadeSlide .3s ease forwards}
@keyframes fadeSlide{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:rgba(0,0,0,.3)}::-webkit-scrollbar-thumb{background:rgba(0,255,255,.3);border-radius:4px}

/* POPUP */
.popup-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:500;opacity:0;pointer-events:none;transition:opacity .3s}
.popup-bg.on{opacity:1;pointer-events:all}
.popup-box{background:linear-gradient(135deg,#050528,#100420);border-radius:18px;padding:28px 36px;text-align:center;max-width:460px;width:90%;transform:scale(.8);transition:transform .35s cubic-bezier(.34,1.56,.64,1);border-top:3px solid #00ffff}
.popup-bg.on .popup-box{transform:scale(1)}
.pop-emoji{font-size:3.5rem;margin-bottom:12px;display:block;animation:popbob .5s ease infinite alternate}
@keyframes popbob{from{transform:scale(1)}to{transform:scale(1.12)}}
.pop-title{font-size:1.3rem;font-weight:900;text-transform:uppercase;letter-spacing:2px;margin-bottom:8px}
.pop-text{font-size:.85rem;opacity:.8;line-height:1.6;margin-bottom:18px}
.pop-close{padding:9px 28px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);border-radius:7px;color:#fff;font-family:'Courier New',monospace;font-size:.8rem;cursor:pointer;transition:background .2s;letter-spacing:1px}
.pop-close:hover{background:rgba(255,255,255,.18)}

/* GAME OVERLAY */
.game-bg{position:fixed;inset:0;background:rgba(0,0,0,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:600;opacity:0;pointer-events:none;transition:opacity .3s;padding:20px}
.game-bg.on{opacity:1;pointer-events:all}
.g-title{font-size:clamp(1.4rem,4vw,2rem);font-weight:900;text-transform:uppercase;letter-spacing:4px;color:#00ffff;text-shadow:0 0 20px #00ffff;margin-bottom:6px}
.g-sub{font-size:.8rem;opacity:.5;letter-spacing:2px;margin-bottom:20px}
.g-round{font-size:1.1rem;color:#ffff00;letter-spacing:2px;margin-bottom:10px}
.g-instruct{font-size:.95rem;opacity:.7;margin-bottom:18px;animation:blink .8s ease infinite}
@keyframes blink{0%,100%{opacity:.7}50%{opacity:.25}}
.countdown-num{font-size:7rem;font-weight:900;color:#ffff00;text-shadow:0 0 40px #ffff00;animation:cdown .7s ease;margin:10px 0}
@keyframes cdown{from{transform:scale(1.6);opacity:0}to{transform:scale(1);opacity:1}}

/* DUEL ARENA */
.duel-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.dbtn{width:170px;height:170px;border-radius:50%;border:3px solid;background:rgba(0,0,0,.5);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:transform .1s,box-shadow .2s;font-family:'Courier New',monospace;font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:.72rem;position:relative;overflow:visible}
.dbtn:hover{transform:scale(1.05)}
.dbtn:active{transform:scale(.93)}
.dbtn img{width:72px;height:72px;border-radius:50%;object-fit:cover;object-position:center 10%}
.dbtn.lit{animation:litpulse .3s ease infinite alternate}
@keyframes litpulse{from{box-shadow:0 0 20px var(--cc)}to{box-shadow:0 0 70px var(--cc),0 0 110px var(--cc)}}
.dscore{position:absolute;top:-4px;right:-4px;background:#000;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:900;border:2px solid}
.scores-row{display:flex;gap:20px;justify-content:center}
.sc-item{text-align:center;font-size:.75rem;opacity:.7}
.sc-num{font-size:1.4rem;font-weight:900;opacity:1}

/* WINNER */
.win-screen{text-align:center;display:none}
.win-screen.show{display:block}
.win-img{width:140px;height:140px;border-radius:50%;object-fit:cover;object-position:center 10%;border:5px solid #ffff00;box-shadow:0 0 40px #ffff00;animation:winspin .8s ease;margin-bottom:16px}
@keyframes winspin{from{transform:rotateY(0deg) scale(0)}to{transform:rotateY(360deg) scale(1)}}
.win-name{font-size:1.8rem;font-weight:900;text-shadow:0 0 20px currentColor;margin-bottom:4px;text-transform:uppercase;letter-spacing:3px}
.win-sub{font-size:.85rem;opacity:.6;margin-bottom:18px}
.win-scores{display:flex;gap:18px;justify-content:center;margin-bottom:22px}
.wsc{text-align:center;font-size:.75rem;opacity:.7}
.wsc-n{font-size:1.4rem;font-weight:900;opacity:1}

/* PARTICLES / FLOATS */
.particle{position:fixed;pointer-events:none;border-radius:50%;animation:pfly var(--dur) ease forwards;z-index:800}
@keyframes pfly{to{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}
.float-e{position:fixed;pointer-events:none;font-size:1.8rem;animation:efloat 1.4s ease forwards;z-index:800}
@keyframes efloat{to{transform:translateY(-140px) scale(.4);opacity:0}}
.dmg-num{position:fixed;font-size:1.8rem;font-weight:900;pointer-events:none;z-index:800;animation:dmgfloat 1s ease forwards;text-shadow:0 0 10px currentColor}
@keyframes dmgfloat{to{transform:translateY(-90px) scale(.5);opacity:0}}
@keyframes flash{0%,100%{filter:brightness(1)}50%{filter:brightness(4)}}
.do-flash{animation:flash .2s ease}
@media(max-width:600px){.card{width:220px}.dbtn{width:130px;height:130px}.dbtn img{width:56px;height:56px}}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="title">⚡ Friend Chaos Battle Simulator ⚡</div>
  <div class="sub">MAXIMUM CHAOS EDITION v2.0 &nbsp;|&nbsp; ALL FRIENDS WILL SUFFER</div>
  <div class="global-bar">
    <span class="glabel">GLOBAL CHAOS:</span>
    <div class="gbar-wrap"><div class="gbar-fill" id="gfill"></div></div>
    <span class="glabel" id="gval">0%</span>
  </div>
</div>

<!-- ARENA -->
<div class="arena" id="arena"></div>

<!-- CONTROLS -->
<div class="ctrl">
  <div class="ctrl-label">// CHAOS CONTROL PANEL //</div>
  <div class="btns">
    <button class="btn b-ego"   onclick="ev('ego')">⬆️ EGO BOOST</button>
    <button class="btn b-arg"   onclick="ev('arg')">💢 START ARGUMENT</button>
    <button class="btn b-chaos" onclick="ev('rng')">🌀 RANDOM CHAOS</button>
    <button class="btn b-comp"  onclick="ev('comp')">✨ COMPLIMENT ATTACK</button>
    <button class="btn b-roast" onclick="ev('roast')">🔥 ROAST EVERYONE</button>
    <button class="btn b-power" onclick="ev('power')">⚡ POWER UP</button>
  </div>
  <button class="btn b-duel" onclick="startDuel()">⚔️ CHAOS DUEL MODE ⚔️</button>
  <br><br>
  <button class="btn b-reset" onclick="resetAll()">↺ RESET SIMULATION</button>
</div>

<!-- LOG -->
<div class="log-wrap">
  <div class="log-box" id="log">
    <div class="log-title">// EVENT LOG //</div>
  </div>
</div>

<!-- POPUP -->
<div class="popup-bg" id="popup">
  <div class="popup-box" id="pbox">
    <span class="pop-emoji" id="pemo"></span>
    <div class="pop-title" id="ptitle"></div>
    <div class="pop-text" id="ptext"></div>
    <button class="pop-close" onclick="closePopup()">[ ACKNOWLEDGED ]</button>
  </div>
</div>

<!-- GAME OVERLAY -->
<div class="game-bg" id="gameOverlay">
  <div id="gContent">
    <div style="text-align:center">
      <div class="g-title">⚔️ CHAOS DUEL ⚔️</div>
      <div class="g-sub">// CLICK THE GLOWING CHARACTER — FASTEST WINS //</div>
      <div class="g-round" id="gRound">ROUND 1 / 15</div>
      <div class="g-instruct" id="gInstruct">GET READY...</div>
    </div>
    <div class="duel-row" id="duelRow"></div>
    <div class="scores-row" id="scoresRow"></div>
  </div>
  <div class="win-screen" id="winScreen">
    <div style="font-size:3rem;margin-bottom:10px">🏆</div>
    <img class="win-img" id="wimg" src="" alt="">
    <div class="win-name" id="wname"></div>
    <div class="win-sub" id="wsub"></div>
    <div class="win-scores" id="wscores"></div>
    <button class="btn b-duel" onclick="closeGame()" style="margin-top:6px">[ RETURN TO CHAOS ]</button>
  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const CHARS = [
  { name:'ALEKSANDR', title:'Supreme Overlord of Vibes',      img:'char1.jpg',  color:'#00ffff', hp:100, ego:60, chaos:20, wins:0, status:'Looking majestic...' },
  { name:'DMITRI',    title:'The Final Boss (Allegedly)',      img:'char2.webp', color:'#ff00ff', hp:100, ego:75, chaos:30, wins:0, status:'Plotting something...' },
  { name:'NIKOLAI',   title:'Secret NPC #3847',               img:'char3.webp', color:'#ffff00', hp:100, ego:40, chaos:50, wins:0, status:'Has no quest items...' },
];

const EVENTS = {
  ego:[
    {e:'👑',t:'EGO OVERFLOW!',          d:'{n} just reminded everyone they are the main character. Ego: critical. Others: cope.'},
    {e:'💅',t:'SLAY MODE ACTIVATED',     d:'{n} looked in the mirror and unlocked a new power level. Everyone else is now an NPC.'},
    {e:'🪞',t:'NARCISSISM SPIKE',        d:'{n} has been staring at their reflection for 20 minutes. Ego +50. Morale of others: -10.'},
    {e:'🎭',t:'MAIN CHARACTER SYNDROME', d:'{n} believes background music plays wherever they go. The frightening part: they might be right.'},
    {e:'📣',t:'UNSOLICITED TED TALK',    d:'{n} started a speech nobody asked for. Somehow everyone is listening. Send help.'},
  ],
  arg:[
    {e:'💢',t:'VERBAL WARFARE INITIATED', d:'All 3 are arguing about who would win in a fight. Nobody will back down. Ever.'},
    {e:'🗣️',t:'WHO STARTED IT?!',         d:"Nobody knows who started the argument but everyone is 100% certain it wasn't them."},
    {e:'🍕',t:'PINEAPPLE GATE',           d:'Someone ordered pineapple on the pizza. This friendship may not survive. Chaos erupts.'},
    {e:'📱',t:'SCREENSHOT DROPPED',       d:'A screenshot was sent out of context. The group chat is on fire. Nobody is okay.'},
    {e:'🎮',t:'GAMING INCIDENT',          d:'Camping accusations fly. Friendship: -500. Chaos: MAX. Controllers almost thrown.'},
  ],
  rng:[
    {e:'🌀',t:'CHAOS SINGULARITY',    d:'Reality destabilized. Nobody knows what year it is. All stats reshuffled. Embrace it.'},
    {e:'🐉',t:'RANDOM DRAGON APPEARED', d:'A dragon showed up for no reason. All three must deal with this immediately.'},
    {e:'🎲',t:'RNG SMITED SOMEONE',   d:"The dice gods have spoken. Someone's stat got yeeted into the void. You'll figure out who."},
    {e:'☎️',t:"MOM CALLED",           d:"All three friends' moms called simultaneously. Nobody is handling it well. Chaos redistributed."},
    {e:'🦆',t:'DUCK APPEARED',        d:'A duck walked in. Nobody can explain it. All stats drop from pure confusion. The duck stays.'},
    {e:'🛸',t:'ALIEN ENDORSEMENT',    d:'An alien broadcast declared one friend "the most chaotic specimen." They are honoured.'},
    {e:'💤',t:'EVERYONE CRASHED',     d:'Mid-argument, all three fell asleep. They wake up. Nothing is resolved. The chaos remains.'},
  ],
  comp:[
    {e:'✨',t:'COMPLIMENT MISSILE',        d:'{n} got a compliment so powerful it triggered an ego crisis. HP+30. Now they want more.'},
    {e:'🥹',t:'TOO KIND. TOO KIND.',       d:'{n} was told they look good today. They have been smiling for 3 hours. Others: jealous.'},
    {e:'💌',t:'UNSOLICITED PRAISE',        d:"A stranger complimented {n}'s drip. They are now completely insufferable. Ego: CRITICAL."},
    {e:'🌟',t:'GALAXY BRAIN ACKNOWLEDGED', d:"{n}'s big brain moment was recognised by all. They're storing this as evidence forever."},
    {e:'👏',t:'EVERYONE CLAPPED',          d:'{n} did something ordinary and everyone clapped. They now expect this always.'},
  ],
  roast:[
    {e:'🔥',t:'SIMULTANEOUS ROAST',      d:'All 3 are roasting each other at once. Nobody is safe. Friendship somehow survives.'},
    {e:'😂',t:'COMEDY MASSACRE',          d:'The roasts were so devastating everyone is crying laughing. Chaos high, morale also somehow high.'},
    {e:'💀',t:"HE'S DEAD, JIM",          d:"One roast was so lethal the others needed a moment of silence. Respect though."},
    {e:'🎤',t:'IMPROMPTU ROAST BATTLE',  d:'This devolved into a roast tournament. The imaginary crowd goes absolutely feral.'},
    {e:'🪦',t:"R.I.P. THEIR EGOS",       d:'The roast was too real. All egos shattered. Chaos up. Friendship somehow: intact.'},
  ],
  power:[
    {e:'⚡',t:'POWER SURGE',          d:'{n} unlocked a new power level. The others sense a disturbance and begin training immediately.'},
    {e:'🌙',t:'36-HOUR GRINDSET',     d:"{n} hasn't slept in 36 hours on a grindset. Their power: undeniable. Their sanity: questionable."},
    {e:'📚',t:'LORE DUMP RECEIVED',   d:'{n} found ancient knowledge (a Reddit post). Power+40. Everyone is being informed about it now.'},
    {e:'🧪',t:'EXPERIMENTAL BUILD',   d:'{n} switched to an experimental build. 70% OP, 30% total collapse. The dice have been cast.'},
    {e:'🏋️',t:'TRAINING ARC',         d:'{n} vanished and returned stronger. No explanation given. None will be given. Do not ask.'},
  ],
};

const HOVER_LINES = ['Don\'t touch me.','I see you clicking me.','...yes?','WHAT.','I\'m busy being iconic.','Click responsibly.','Rude.','This is fine.','I felt that.','...(glares)','Remove your cursor.','I don\'t do autographs.'];

let globalChaos = 0;

// ── RENDER ARENA ──────────────────────────────────────────────────────────────
function renderArena() {
  const a = document.getElementById('arena');
  a.innerHTML = '';
  CHARS.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'card'; d.dataset.i = i;
    d.onclick = e => cardClick(i, e);
    d.innerHTML = `
      <div class="wbadge" id="wb${i}">🏆 ${c.wins}W</div>
      <div class="av-wrap">
        <div class="av-ring"></div>
        <img class="av-img" src="${c.img}" alt="${c.name}" onerror="this.style.background='#111';this.style.content='';this.parentElement.style.background='linear-gradient(135deg,#111,#222)'">
      </div>
      <div class="cname" style="color:${c.color}">${c.name}</div>
      <div class="ctitle" style="color:${c.color}88">${c.title}</div>
      <div class="stats">
        <div class="srow"><span class="slabel">HP</span><div class="sbar"><div class="sfill hp" id="hp${i}" style="width:${c.hp}%"></div></div><span class="sval" id="hv${i}">${c.hp}</span></div>
        <div class="srow"><span class="slabel">EGO</span><div class="sbar"><div class="sfill ego" id="eg${i}" style="width:${c.ego}%"></div></div><span class="sval" id="ev${i}">${c.ego}</span></div>
        <div class="srow"><span class="slabel">CHAOS</span><div class="sbar"><div class="sfill chaos" id="ch${i}" style="width:${c.chaos}%"></div></div><span class="sval" id="cv${i}">${c.chaos}</span></div>
      </div>
      <div class="cstatus" id="st${i}">${c.status}</div>`;
    a.appendChild(d);
  });
}

function syncStats() {
  CHARS.forEach((c, i) => {
    c.hp = clamp(c.hp); c.ego = clamp(c.ego); c.chaos = clamp(c.chaos);
    set(`hp${i}`, 'width', c.hp + '%'); set(`eg${i}`, 'width', c.ego + '%'); set(`ch${i}`, 'width', c.chaos + '%');
    txt(`hv${i}`, Math.round(c.hp)); txt(`ev${i}`, Math.round(c.ego)); txt(`cv${i}`, Math.round(c.chaos));
    txt(`st${i}`, c.status);
    const wb = document.getElementById(`wb${i}`);
    if (wb) { wb.style.display = c.wins > 0 ? 'block' : 'none'; wb.textContent = `🏆 ${c.wins}W`; }
  });
  globalChaos = clamp(globalChaos);
  set('gfill', 'width', globalChaos + '%'); txt('gval', Math.round(globalChaos) + '%');
}
const clamp = v => Math.max(0, Math.min(100, v));
const set = (id, p, v) => { const el = document.getElementById(id); if (el) el.style[p] = v; };
const txt = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
const rnd = arr => arr[Math.floor(Math.random() * arr.length)];
const others = i => [0,1,2].filter(x => x !== i);

// ── EVENTS ────────────────────────────────────────────────────────────────────
function ev(type) {
  const pool = EVENTS[type];
  const data = rnd(pool);
  let ti = Math.floor(Math.random() * 3);

  switch(type) {
    case 'ego':
      CHARS[ti].ego    = clamp(CHARS[ti].ego + 20 + rand(15));
      CHARS[ti].hp     = clamp(CHARS[ti].hp + 10);
      CHARS[ti].status = 'Feeling UNSTOPPABLE.';
      others(ti).forEach(o => { CHARS[o].ego = clamp(CHARS[o].ego - 5); CHARS[o].chaos = clamp(CHARS[o].chaos + 10); CHARS[o].status = 'Wait, what about ME?!'; anim(o,'shake'); });
      globalChaos = clamp(globalChaos + 10);
      anim(ti,'victory'); particles(cardCtr(ti), CHARS[ti].color);
      popup(data.e, data.t, data.d.replace('{n}', CHARS[ti].name), CHARS[ti].color);
      addLog(`${CHARS[ti].name}'s ego went nuclear. The others are coping.`);
      break;

    case 'arg':
      CHARS.forEach((c,i) => { c.chaos = clamp(c.chaos + 20 + rand(15)); c.hp = clamp(c.hp - 10); c.status = 'UNACCEPTABLE!!'; anim(i,'shake'); });
      globalChaos = clamp(globalChaos + 25);
      popup(data.e, data.t, data.d, '#ff00ff');
      addLog(`ARGUMENT ERUPTS: ${data.t}`);
      break;

    case 'rng':
      CHARS.forEach((c,i) => { c.hp = 30 + rand(70); c.ego = rand(100); c.chaos = 30 + rand(70); c.status = 'What just happened??'; anim(i, Math.random()>.5?'victory':'shake'); });
      globalChaos = 50 + rand(50);
      popup(data.e, data.t, data.d, '#ffffff');
      addLog(`CHAOS EVENT: ${data.t}`);
      break;

    case 'comp':
      CHARS[ti].ego    = clamp(CHARS[ti].ego + 15);
      CHARS[ti].hp     = clamp(CHARS[ti].hp + 20);
      CHARS[ti].chaos  = clamp(CHARS[ti].chaos - 10);
      CHARS[ti].status = 'Living for this right now.';
      others(ti).forEach(o => { CHARS[o].chaos = clamp(CHARS[o].chaos + 5); CHARS[o].status = 'Why not me though...'; });
      globalChaos = clamp(globalChaos + 5);
      anim(ti,'victory'); floatEmojis(cardCtr(ti), ['✨','🌟','💫','⭐']);
      popup(data.e, data.t, data.d.replace('{n}', CHARS[ti].name), CHARS[ti].color);
      addLog(`${CHARS[ti].name} got complimented and is now impossible to deal with.`);
      break;

    case 'roast':
      CHARS.forEach((c,i) => { c.ego = clamp(c.ego - 20 + rand(10)); c.chaos = clamp(c.chaos + 15); c.hp = clamp(c.hp - 5); c.status = "I'm fine. This is fine."; anim(i,'shake'); });
      globalChaos = clamp(globalChaos + 20);
      popup(data.e, data.t, data.d, '#ff6600');
      addLog(`ROAST SESSION: All egos take critical damage.`);
      break;

    case 'power':
      CHARS[ti].hp     = clamp(CHARS[ti].hp + 30);
      CHARS[ti].ego    = clamp(CHARS[ti].ego + 25);
      CHARS[ti].chaos  = clamp(CHARS[ti].chaos - 15);
      CHARS[ti].status = 'POWER OVERWHELMINGGG';
      others(ti).forEach(o => { CHARS[o].chaos = clamp(CHARS[o].chaos + 10); CHARS[o].status = 'I sense a disturbance...'; });
      globalChaos = clamp(globalChaos + 15);
      anim(ti,'victory'); particles(cardCtr(ti), CHARS[ti].color, 28);
      popup(data.e, data.t, data.d.replace('{n}', CHARS[ti].name), CHARS[ti].color);
      addLog(`${CHARS[ti].name} powered up. The others felt it in their bones.`);
      break;
  }
  syncStats();
}

function rand(n) { return Math.floor(Math.random() * n); }

function cardClick(i, e) {
  if (duelActive && duelTarget === i) { registerHit(i); return; }
  CHARS[i].status = rnd(HOVER_LINES);
  syncStats();
  floatEmojis({ x: e.clientX, y: e.clientY }, ['👀','✋','❓','‼️']);
}

// ── ANIMATION HELPERS ─────────────────────────────────────────────────────────
function anim(i, type) {
  const card = document.querySelector(`.card[data-i="${i}"]`);
  if (!card) return;
  card.classList.remove('do-shake','do-victory','do-hurt');
  void card.offsetWidth;
  card.classList.add(`do-${type}`);
  setTimeout(() => card.classList.remove(`do-${type}`), 1000);
}

function cardCtr(i) {
  const card = document.querySelector(`.card[data-i="${i}"]`);
  if (!card) return { x: innerWidth/2, y: innerHeight/2 };
  const r = card.getBoundingClientRect();
  return { x: r.left + r.width/2, y: r.top + r.height/2 };
}

function particles(pos, color, n = 16) {
  for (let k = 0; k < n; k++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const ang = Math.random() * Math.PI * 2, dist = 60 + Math.random() * 130;
    const size = 3 + Math.random() * 5, dur = .5 + Math.random() * .7;
    p.style.cssText = `left:${pos.x}px;top:${pos.y}px;width:${size}px;height:${size}px;background:${color};box-shadow:0 0 6px ${color};--tx:${Math.cos(ang)*dist}px;--ty:${Math.sin(ang)*dist}px;--dur:${dur}s;animation-delay:${Math.random()*.2}s;opacity:1`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), (dur + .3) * 1000);
  }
}

function floatEmojis(pos, arr) {
  arr.slice(0,4).forEach((e, k) => {
    const el = document.createElement('div');
    el.className = 'float-e'; el.textContent = e;
    el.style.cssText = `left:${pos.x + (k-1.5)*28}px;top:${pos.y - 10}px;animation-delay:${k*.08}s`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1700);
  });
}

// ── POPUP ─────────────────────────────────────────────────────────────────────
function popup(emoji, title, text, color = '#00ffff') {
  document.getElementById('pemo').textContent = emoji;
  document.getElementById('ptitle').textContent = title;
  document.getElementById('ptitle').style.color = color;
  document.getElementById('ptext').textContent = text;
  document.getElementById('pbox').style.borderTopColor = color;
  document.getElementById('popup').classList.add('on');
}
function closePopup() { document.getElementById('popup').classList.remove('on'); }

// ── LOG ───────────────────────────────────────────────────────────────────────
function addLog(msg) {
  const log = document.getElementById('log');
  const e = document.createElement('div');
  e.className = 'log-entry';
  const t = new Date().toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
  e.innerHTML = `<span style="opacity:.35">[${t}]</span> ${msg}`;
  log.appendChild(e);
  log.scrollTop = log.scrollHeight;
  const all = log.querySelectorAll('.log-entry');
  if (all.length > 25) all[0].remove();
}

// ── DUEL MINI-GAME ────────────────────────────────────────────────────────────
let duelActive = false, duelTarget = -1, duelRound = 0, duelScores = [0,0,0], duelTimer = null;
const MAX_R = 15;

function startDuel() {
  duelScores = [0,0,0]; duelRound = 0; duelActive = false; duelTarget = -1;
  clearTimeout(duelTimer);

  document.getElementById('gContent').style.display = 'block';
  document.getElementById('winScreen').classList.remove('show');
  document.getElementById('gameOverlay').classList.add('on');

  buildDuelBtns();
  syncDuelScores();

  // countdown
  let n = 3;
  const instruct = document.getElementById('gInstruct');
  instruct.style.animation = 'none'; instruct.textContent = '';

  const cEl = document.createElement('div');
  cEl.className = 'countdown-num'; cEl.textContent = n;
  document.getElementById('gContent').insertBefore(cEl, document.getElementById('duelRow'));

  const iv = setInterval(() => {
    n--;
    if (n > 0) {
      cEl.style.animation = 'none'; void cEl.offsetWidth; cEl.style.animation = 'cdown .7s ease'; cEl.textContent = n;
    } else {
      clearInterval(iv);
      cEl.textContent = 'FIGHT!'; cEl.style.color = '#ff0055'; cEl.style.textShadow = '0 0 40px #ff0055';
      setTimeout(() => { cEl.remove(); instruct.style.animation = 'blink .8s ease infinite'; instruct.textContent = 'CLICK THE GLOWING ONE!'; duelActive = true; nextRound(); }, 700);
    }
  }, 700);
}

function buildDuelBtns() {
  const row = document.getElementById('duelRow');
  row.innerHTML = '';
  CHARS.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'dbtn'; b.id = `db${i}`;
    b.style.cssText = `border-color:${c.color};color:${c.color};--cc:${c.color}`;
    b.onclick = () => duelActive && duelTarget === i ? registerHit(i) : wrongClick(i);
    b.innerHTML = `<img src="${c.img}" alt="${c.name}" onerror="this.style.opacity='.3'"><span>${c.name}</span><div class="dscore" id="ds${i}" style="border-color:${c.color};color:${c.color}">0</div>`;
    row.appendChild(b);
  });
  syncDuelScores();
}

function syncDuelScores() {
  duelScores.forEach((s, i) => txt(`ds${i}`, s));
  txt('gRound', `ROUND ${Math.min(duelRound + 1, MAX_R)} / ${MAX_R}`);
}

function nextRound() {
  if (!duelActive) return;
  clearLit();
  if (duelRound >= MAX_R) { endDuel(); return; }
  const delay = 350 + Math.random() * 900;
  duelTimer = setTimeout(() => {
    if (!duelActive) return;
    duelTarget = rand(3);
    litUp(duelTarget);
    duelTimer = setTimeout(() => {
      if (!duelActive) return;
      clearLit(); duelTarget = -1;
      addLog(`Round ${duelRound + 1}: too slow! No point awarded.`);
      duelRound++; syncDuelScores(); nextRound();
    }, 1800);
  }, delay);
}

function litUp(i) {
  const b = document.getElementById(`db${i}`);
  if (b) { b.classList.add('lit'); b.style.background = `rgba(${hexRgb(CHARS[i].color)},.18)`; }
}
function clearLit() {
  CHARS.forEach((_,i) => { const b = document.getElementById(`db${i}`); if(b){b.classList.remove('lit');b.style.background='rgba(0,0,0,.5)';} });
}

function registerHit(i) {
  clearTimeout(duelTimer); clearLit(); duelTarget = -1;
  duelScores[i]++; syncDuelScores();
  const b = document.getElementById(`db${i}`);
  if (b) { b.classList.add('do-flash'); setTimeout(() => b.classList.remove('do-flash'), 200); }
  particles(btnCtr(i), CHARS[i].color, 12);
  addLog(`Round ${duelRound + 1}: ${CHARS[i].name} nailed it! (${duelScores[i]} pts)`);
  duelRound++; syncDuelScores(); nextRound();
}

function wrongClick(i) {
  const b = document.getElementById(`db${i}`);
  if (b) { b.style.background = 'rgba(255,0,0,.25)'; setTimeout(() => b.style.background = 'rgba(0,0,0,.5)', 300); }
}

function btnCtr(i) {
  const b = document.getElementById(`db${i}`);
  if (!b) return { x: innerWidth/2, y: innerHeight/2 };
  const r = b.getBoundingClientRect();
  return { x: r.left + r.width/2, y: r.top + r.height/2 };
}

function endDuel() {
  duelActive = false; clearTimeout(duelTimer);
  const max = Math.max(...duelScores);
  const winners = duelScores.map((s,i) => s===max?i:-1).filter(x=>x>=0);
  const tie = winners.length > 1;
  const wi = winners[0];
  CHARS[wi].wins++; syncStats();

  document.getElementById('gContent').style.display = 'none';
  const ws = document.getElementById('winScreen');
  ws.classList.add('show');

  document.getElementById('wimg').src = CHARS[wi].img;
  document.getElementById('wname').textContent = tie ? "IT'S A TIE?!" : CHARS[wi].name;
  document.getElementById('wname').style.color = tie ? '#ffffff' : CHARS[wi].color;
  const subs = ['Certified Chaos Champion.','They clicked so fast it was suspicious.','Speed itself bows before this one.','The others are studying the tape.','Undisputed GOAT of clicking.'];
  document.getElementById('wsub').textContent = tie ? 'The universe refuses to decide. Both valid. Peak chaos.' : rnd(subs);
  document.getElementById('wscores').innerHTML = CHARS.map((c,i) => `<div class="wsc"><div class="wsc-n" style="color:${c.color}">${duelScores[i]}</div><div>${c.name}</div></div>`).join('');

  addLog(`DUEL OVER — ${tie ? 'TIE' : CHARS[wi].name} wins with ${max} rounds!`);
  for (let k = 0; k < 6; k++) setTimeout(() => particles({x:Math.random()*innerWidth,y:Math.random()*innerHeight}, CHARS[wi].color, 14), k*180);
}

function closeGame() {
  duelActive = false; clearTimeout(duelTimer);
  document.getElementById('gameOverlay').classList.remove('on');
  syncStats(); addLog('Returned from duel. The chaos continues.');
}

function hexRgb(h) {
  const r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h);
  return r ? `${parseInt(r[1],16)},${parseInt(r[2],16)},${parseInt(r[3],16)}` : '255,255,255';
}

function resetAll() {
  [{ hp:100,ego:60,chaos:20,status:'Looking majestic...' },{ hp:100,ego:75,chaos:30,status:'Plotting something...' },{ hp:100,ego:40,chaos:50,status:'Has no quest items...' }]
    .forEach((d,i) => Object.assign(CHARS[i], d, {wins:0}));
  globalChaos = 0; syncStats();
  document.querySelectorAll('.log-entry').forEach(e => e.remove());
  addLog('Simulation reset. The chaos begins anew.');
}

// ── INIT ──────────────────────────────────────────────────────────────────────
renderArena(); syncStats();
addLog('CHAOS BATTLE SIMULATOR INITIALIZED. All characters loaded and accounted for.');
addLog('Use the control panel to trigger events. Hit CHAOS DUEL for the mini-game.');

// occasional auto-event every ~18s
setInterval(() => {
  if (!document.getElementById('popup').classList.contains('on') && !document.getElementById('gameOverlay').classList.contains('on')) {
    ev(rnd(['ego','arg','rng','comp','roast','power']));
  }
}, 18000);
</script>
</body>
</html>
